<title>投稿ストック</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: 日付ごとの縦並びカード。各日は3枠（08:00 / 12:00 / 15:00）。選んだ案だけが大きく残る。 */
:root{
  --bg:#f2f4f7; --card:#ffffff; --ink:#18212b; --mut:#667385; --line:#dde2e9;
  --acc:#e0601c; --acc-ink:#ffffff; --blue:#2c5a8a; --ok:#2f7d4f; --soft:#fbe9dd;
  --font:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --card:#1b222b; --ink:#e9edf2; --mut:#93a0b0; --line:#2b3440;
  --acc:#f07a38; --acc-ink:#1a1008; --blue:#7fb0e0; --ok:#6fcf93; --soft:#3a2518; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --card:#1b222b; --ink:#e9edf2; --mut:#93a0b0; --line:#2b3440;
  --acc:#f07a38; --acc-ink:#1a1008; --blue:#7fb0e0; --ok:#6fcf93; --soft:#3a2518; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--font);
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:21px;margin:0;font-weight:700}
.sub{color:var(--mut);font-size:13px;margin:2px 0 0}
.sum{display:flex;gap:10px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px}
.pill b{color:var(--acc)}
.day{display:flex;flex-direction:column;gap:10px}
.day>h2{font-size:15px;margin:6px 0 0;font-weight:700}
.slot{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.slot-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.time{font-weight:700;font-variant-numeric:tabular-nums}
.lbl{color:var(--mut);font-size:13px}
.tag{margin-left:auto;font-size:12px;border-radius:999px;padding:1px 10px;background:var(--line);color:var(--mut)}
.tag.on{background:var(--soft);color:var(--acc)}.tag.done{background:var(--ok);color:var(--acc-ink)}
.cand{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.cand .id{color:var(--mut);font-size:12px;min-width:22px;padding-top:2px}
.cand p{margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
button,.btn{font:inherit;font-size:14px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
button:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:500}
.pick p.text{margin:0;font-size:16px;line-height:1.7;overflow-wrap:anywhere;white-space:pre-wrap}
.rep{margin-top:10px;padding-left:12px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.aff{display:flex;flex-direction:column;gap:6px}
.aff label{display:flex;flex-direction:column;gap:4px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:0 1 auto}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{font-size:13px;padding:4px 11px;border-radius:999px}
.step.cur{background:var(--blue);border-color:var(--blue);color:var(--acc-ink)}
.perf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.perf label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:2px}
input,textarea{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box;min-width:0}
.hint{font-size:12px;color:var(--mut)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:22px 16px;color:var(--mut)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px}
</style>

<div id="app">
  <header>
    <h1>投稿ストック</h1>
  </header>
  <div id="sum" class="sum"></div>
  <div id="list"></div>
  <section class="slot" id="set">
    <h2 style="font-size:15px;margin:0">楽天リンク設定</h2>
    <p class="hint" style="margin:0">楽天アフィリエイトで作った自分のリンクを1つ貼り、その中の商品URL部分を {URL} に置き換えて保存します。以降は商品ページのURLを貼るだけでリンクが作れます。</p>
    <input id="tpl" type="text" placeholder="例: https://hb.afl.rakuten.co.jp/hgc/（自分のID）/?pc={URL}&amp;m={URL}">
    <div class="row"><button id="tplsave" class="pri">保存</button></div>
  </section>
</div>
<div id="toast" class="toast" hidden></div>

<script>
const SLOTS=[
 {key:'news',time:'08:00',label:'ニュース＋コメント',img:true},
 {key:'aruaru',time:'予備',label:'製造業あるある（予備）',img:true,optional:true},
 {key:'affiliate',time:'12:00',label:'アフィリエイトPR',img:false},
 {key:'question',time:'15:00',label:'真面目な問いかけ',img:true}];
const FLOW_IMG=[['picked','選択済み'],['ready','画像OK'],['scheduled','予約済み'],['posted','投稿済み']];
const FLOW_TXT=[['picked','選択済み'],['scheduled','予約済み'],['posted','投稿済み']];
const MAXLEN=140;
let col=null, dbh=null, tpl='', docs=[], loaded=false;

const $=s=>document.querySelector(s);
function h(tag,attrs={},...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==='class')e.className=v; else if(k==='on')for(const [ev,fn] of Object.entries(v))e.addEventListener(ev,fn);
    else if(v!==false&&v!=null)e.setAttribute(k,v);
  }
  for(const k of kids.flat())if(k!=null)e.append(k.nodeType?k:document.createTextNode(k));
  return e;
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1800)}
async function copy(text,msg){
  try{await navigator.clipboard.writeText(text);toast(msg)}
  catch(e){const ta=h('textarea',{readonly:'',rows:4});ta.value=text;document.body.append(ta);ta.select();toast('選択しました。コピーしてください');setTimeout(()=>ta.remove(),8000)}
}
function imagePrompt(text){
  return '添付した画像のキャラクター（オレンジ色のふんわりした髪、にこやかな笑顔の青年、青い作業着）と同一人物を主人公にしたイラストを描いてください。\n- フラットでやわらかい絵柄、細めの線、正方形（1:1）\n- 舞台は製造業の現場\n- 画像の中に文字や数字は入れない\n- 安全に関わる場面では保護具（保護メガネ・ヘルメット）を着用させる\n\n場面: 次のX投稿の内容を、見た人が思わずクスッと・ハッとする1場面で表現してください。\n構図・ポーズ・背景を変えた3パターンを、別々の画像として3枚生成してください。\n「'+text+'」';
}
function dayLabel(d){const [y,m,dd]=d.split('-').map(Number);const w='日月火水木金土'[new Date(y,m-1,dd).getDay()];return m+'/'+dd+'（'+w+'）'}
const ref=d=>col.doc(d.id);
async function setStatus(d,status){try{await ref(d).update({status})}catch(e){toast('保存できませんでした')}}
async function pick(d){
  try{
    for(const o of docs){
      if(o.date!==d.date||o.slot!==d.slot)continue;
      if(o.id===d.id){if(o.status==='candidate')await ref(o).update({status:'picked'})}
      else if(o.status!=='candidate')await ref(o).update({status:'candidate'});
    }
  }catch(e){toast('保存できませんでした')}
}
async function savePerf(d,field,val){
  const n=val===''?null:Number(val);
  try{await ref(d).update({[field]:field==='note'?val:(Number.isFinite(n)?n:null)});toast('記録しました')}catch(e){toast('保存できませんでした')}
}

let armed=null,armT;
function arm(key){armed=key;clearTimeout(armT);armT=setTimeout(()=>{armed=null;render()},4000);render()}
function delBtn(label,key,fn){return h('button',{class:'step',on:{click:()=>{if(armed===key){armed=null;fn()}else arm(key)}}},armed===key?'もう一度押すと削除します':label)}
async function delGroup(date,slot){
  try{
    for(const d of docs.filter(x=>x.date===date&&x.slot===slot)){
      const {id,...rest}=d;
      if(rest.status&&rest.status!=='candidate')await dbh.doc('archive/'+id).set({...rest,archivedAt:Date.now()});
      await ref(d).delete();
    }
    toast('削除しました')
  }catch(e){toast('削除できませんでした')}
}
async function saveUrl(d,url){try{await ref(d).update({url});toast('保存しました')}catch(e){toast('保存できませんでした')}}
function slotView(day,slot,items){
  const picked=items.find(i=>i.status&&i.status!=='candidate');
  const head=(tag)=>h('div',{class:'slot-h'},h('span',{class:'time'},slot.time),h('span',{class:'lbl'},slot.label),tag);
  if(!items.length)return h('section',{class:'slot'},head(h('span',{class:'tag'},'案なし')),h('p',{class:'hint',style:'margin:0'},slot.key==='affiliate'?'商品リストが届き次第、Claudeが案を作ります。':'Claudeが次の朝に案を作ります。'));
  if(!picked){
    return h('section',{class:'slot'},head(h('span',{class:'tag on'},'選んでください')),
      items.map(c=>h('div',{class:'cand'},h('span',{class:'id'},c.cid),h('p',{},c.text,(c.replies||[]).map(r=>h('span',{class:'hint',style:'display:block'},'↳ '+r))),h('button',{class:'pri',on:{click:()=>pick(c)}},'これ'))));
  }
  const flow=slot.img?FLOW_IMG:FLOW_TXT;
  const base=picked.text;
  const link=(slot.key==='affiliate'&&picked.url&&tpl)?tpl.split('{URL}').join(encodeURIComponent(picked.url)):'';
  const reps=[...(picked.replies||[])];
  if(link){if(reps.length)reps[reps.length-1]+='\n'+link;else reps.push(link)}
  const text=base, over=[...base].length>MAXLEN||(picked.replies||[]).some(r=>[...r].length>MAXLEN);
  const posted=picked.status==='posted';
  const tag=h('span',{class:'tag '+(posted?'done':'on')},(flow.find(f=>f[0]===picked.status)||[0,'選択済み'])[1]);
  const children=[head(tag),
    h('div',{class:'pick'},h('p',{class:'text'},text),reps.map((r,i)=>h('div',{class:'rep'},h('p',{class:'text'},r),h('button',{on:{click:()=>copy(r,'リプライ'+(i+1)+'をコピーしました')}},'リプライ'+(i+1)+'をコピー'))),over?h('p',{class:'hint'},'文字数が上限（全角140字）を超えています'):null),
    slot.key==='affiliate'?h('div',{class:'aff'},
      h('label',{class:'hint'},'楽天の商品ページURL（貼ると、アフィリエイトリンクを自動で作ります）',h('input',{type:'url',id:'u-'+picked.id,value:picked.url||'',placeholder:'https://item.rakuten.co.jp/...',on:{change:e=>saveUrl(picked,e.target.value.trim())}})),
      !tpl?h('p',{class:'hint'},'リンクのひな形が未設定です。ページ下の「楽天リンク設定」を入力してください。'):null,
      !base.includes('#PR')?h('p',{class:'hint'},'本文に「#PR」がありません。付けてから投稿してください。'):null):null,
    h('div',{class:'row'},
      h('button',{class:'pri',on:{click:()=>copy(text,'本文をコピーしました')}},'本文をコピー'),
      slot.img?h('a',{class:'btn',href:'https://chatgpt.com/?q='+encodeURIComponent(imagePrompt(base)),target:'_blank',rel:'noopener',on:{click:()=>copy(imagePrompt(base),'プロンプトをコピーした。入ってなければ貼り付けてね')}},'ChatGPTで画像3案'):null,
      h('a',{class:'btn',href:'https://x.com/intent/post?text='+encodeURIComponent(text),target:'_blank',rel:'noopener'},'Xで投稿画面を開く')),
    h('div',{class:'steps'},
      posted?delBtn('削除','g-'+picked.date+slot.key,()=>delGroup(picked.date,slot.key)):h('button',{class:'step',on:{click:()=>setStatus(picked,'posted')}},'投稿済み'),
      h('button',{class:'step',on:{click:()=>setStatus(picked,'candidate')}},'選び直す'))];
  return h('section',{class:'slot'},children);
}

function render(){
  const sum=$('#sum'),list=$('#list');
  sum.replaceChildren();list.replaceChildren();
  if(!col){list.append(h('div',{class:'empty'},'保存機能を利用できません。ページを開き直すか、アカウントでサインインしているか確認してください。'));return}
  if(!loaded){list.append(h('div',{class:'empty'},'読み込み中です…'));return}
  if(!docs.length){list.append(h('div',{class:'empty'},'まだ投稿案がありません。Claudeが毎朝、3枠×5案をここに追加します。'));return}
  const dates=[...new Set(docs.map(d=>d.date))].sort();
  let full=0,picks=0,slots=0;
  for(const date of dates){
    let ok=true;
    for(const s of SLOTS){
      const items=docs.filter(d=>d.date===date&&d.slot===s.key);
      if(s.optional&&!items.some(i=>i.status&&i.status!=='candidate'))continue;
      if(!items.length){ok=false;continue}
      slots++;
      if(items.some(i=>i.status&&i.status!=='candidate'))picks++;else ok=false;
    }
    if(ok)full++;
  }
  sum.append(h('span',{class:'pill'},'3枠そろった日 ',h('b',{},full),' 日分'),h('span',{class:'pill'},'選択済み ',h('b',{},picks),' / ',slots,' 枠'));
  const used=[...new Set(docs.filter(d=>d.status==='posted').map(d=>d.date+'|'+d.slot))];
  if(used.length)sum.append(delBtn('投稿済み '+used.length+'枠をまとめて削除','all',async()=>{for(const u of used){const [dd,ss]=u.split('|');await delGroup(dd,ss)}}));
  for(const date of dates){
    const box=h('div',{class:'day'},h('h2',{},dayLabel(date)));
    for(const s of SLOTS){
      const items=docs.filter(d=>d.date===date&&d.slot===s.key).sort((a,b)=>a.cid.localeCompare(b.cid,'ja',{numeric:true}));
      if(s.optional&&!items.length)continue;
      box.append(slotView(date,s,items));
    }
    list.append(box);
  }
}

$('#tplsave').addEventListener('click',async()=>{
  const v=$('#tpl').value.trim();
  if(!dbh)return toast('保存機能を利用できません');
  if(v&&!v.includes('{URL}'))return toast('{URL} を含めてください');
  try{await dbh.doc('settings/affiliate').set({template:v});toast('保存しました')}catch(e){toast('保存できませんでした')}
});
render();
(async()=>{
  const timer=setTimeout(()=>{if(!loaded)toast('データに接続できていません。しばらくお待ちください')},10000);
  try{
    const db=await window.claude?.use('db');
    if(!db){col=null;render();return}
    dbh=db;col=db.collection('posts');
    db.doc('settings/affiliate').onSnapshot(s=>{tpl=(s.exists&&s.data().template)||'';const i=$('#tpl');if(i&&document.activeElement!==i)i.value=tpl;render()},()=>{});
    col.onSnapshot(s=>{loaded=true;clearTimeout(timer);docs=s.docs.map(x=>({id:x.id,...x.data()}));render()},
      e=>{loaded=true;clearTimeout(timer);toast('読み込みエラー: '+e.code);render()});
  }catch(e){col=null;render()}
})();
</script>
